<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gonbi Viewport</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <span class="bar__icon" data-icon="brand"></span>
      <input
        id="search"
        type="search"
        placeholder="Search devices…"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search devices"
        role="combobox"
        aria-expanded="true"
        aria-controls="list"
        aria-autocomplete="list"
      />
    </header>

    <main id="list" class="list" role="listbox" aria-label="Devices"></main>

    <footer class="foot">
      <span class="foot__label">Opening</span>
      <span id="target" class="foot__url">the current tab</span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
